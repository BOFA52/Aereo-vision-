<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aéreo Visión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
    <div class="logo">
        <img src="imagenes/logo-AV-Photoroom.png" alt="">
    </div>
    <nav>
        <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#galeria">Galería</a></li>
        <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
    </header>

    <section class="hero" id="inicio">
    <div class="hero-content">
        <h1>Capturamos la belleza desde el cielo</h1>
        <a href="#servicios" class="btn">Ver Servicios</a>
    </div>
    </section>

    <section class="servicios" id="servicios">
    <h2>Nuestros Servicios</h2>
    <div class="cards">
        <div class="card card-1">Videos Aéreos</div>
        <div class="card card-2">Fotografías para Eventos</div>
        <div class="card card-3">Tours Visuales</div>
        <div class="card card-4">Contenido para Redes</div>
    </div>
    </section>

    <section class="galeria" id="galeria">
    <h2>Galería</h2>
    <div class="imagenes">
        <img src="imagenes/imagne-01.jpg" alt="Imagen 1">
        <img src="imagenes/imagen-02.jpg" alt="Imagen 2">
        <img src="imagenes/imagen-03.jpg" alt="Imagen 3">
        <img src="imagenes/imagen-04.jpg" alt="Imagen 4">
        <img src="imagenes/imagen-05.jpg" alt="Imagen 5">
        <img src="imagenes/imagen-02.jpg" alt="Imagen 6">
    </div>
    </section>

    <section class="contacto" id="contacto">
    <h2>Contáctanos</h2>
    <form>
        <input type="text" placeholder="Tu nombre">
        <input type="email" placeholder="Tu correo">
        <textarea placeholder="Tu mensaje"></textarea>
        <button type="submit">Enviar</button>
    </form>
    </section>

    <footer>
    <p>Síguenos en Instagram @aereovision7 | Todos los derechos reservados © 2025</p>
    </footer>
</body>
</html>
